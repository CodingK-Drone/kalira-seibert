<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">

  <title>Kalira Seibert | Writing Archive</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="timeline">

    <!-- BANNER WITH NAME AND SEARCH ICON -->
    <div class="banner">

      <img
        src="images/banner.webp"
        alt="Profile banner"
      >

      <header class="banner-nav">

        <div>
          <h1 id="top-name">Kalira Seibert</h1>
          <span id="post-count">Writing archive</span>
        </div>

        <button
          class="search-button"
          id="search-button"
          type="button"
          aria-label="Search archive"
          aria-expanded="false"
          aria-controls="search-wrap"
          onclick="toggleSearch()"
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
        </button>

      </header>

    </div>

    <!-- PROFILE INFORMATION -->
    <section class="profile">

      <img
        src="images/profile.webp"
        class="avatar big"
        alt="Kalira Seibert's profile picture"
      >

      <div class="profile-details">

        <h2 id="profile-name">Kalira Seibert</h2>

        <p class="handle" id="profile-handle">
          @kalira_seibert
        </p>

        <p id="profile-bio">Your favorite living mannequin.

Now freeze, and join my gallery 💜</p>

      </div>

    </section>

  <!-- POSTS HEADER AND COUNTER -->
<nav class="tabs">
  <span>Posts</span>
  <span id="archive-count">0 posts</span>
</nav>

<!-- ALWAYS VISIBLE SEARCH BAR -->
<div class="search-wrap" id="search-wrap">
  <label for="search">Search posts</label>

  <input
    id="search"
    type="search"
    placeholder="Search the archive..."
    autocomplete="off"
  >
</div>

    <!-- ARCHIVED POSTS -->
    <section
      id="feed"
      aria-label="Archived posts"
    ></section>

    <p id="empty" hidden>
      No posts found.
    </p>

    <!-- FOOTER -->
    <footer>
      Obey Owner Kalira.
    </footer>

  </main>

  <!-- WEBSITE SCRIPTS -->
  <script src="posts.js"></script>
  <script src="script.js"></script>

  <!-- SEARCH BUTTON -->
  <script>
    function toggleSearch() {
      const searchBox =
        document.getElementById("search-wrap");

      const searchButton =
        document.getElementById("search-button");

      searchBox.hidden = !searchBox.hidden;

      searchButton.setAttribute(
        "aria-expanded",
        String(!searchBox.hidden)
      );

      if (!searchBox.hidden) {
        document.getElementById("search").focus();
      } else {
        const searchInput =
          document.getElementById("search");

        searchInput.value = "";
        searchInput.dispatchEvent(
          new Event("input", { bubbles: true })
        );
      }
    }
  </script>

</body>
</html>
