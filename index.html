<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Writing Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="timeline">
<header class="topbar">
  <span class="back" aria-hidden="true">←</span>
  <div>
    <h1 id="top-name">YOUR NAME</h1>
    <span id="post-count">Writing archive</span>
  </div>
</header>

<div class="banner">
  <img src="images/banner.webp" alt="Profile banner">
</div>

<section class="profile">
  <img
    src="images/profile.webp"
    class="avatar big"
    alt="Profile picture"
  >

  <h2 id="profile-name">Kalira Seibert</h2>

  <p class="handle" id="profile-handle">@ukalira_seibert</p>

  <p id="profile-bio">
    Your favorite living mannequin.

    Now freeze, and join my gallery 💜
  </p>
</section>
What to customize
    <nav class="tabs"><span>Posts</span></nav>
    <div class="search-wrap"><label for="search">Search posts</label><input id="search" type="search" placeholder="Search the archive…"></div>
    <section id="feed" aria-label="Archived posts"></section>
    <p id="empty" hidden>No posts found.</p>
    <footer>Preserved with care.</footer>
  </main>
  <script src="posts.js"></script>
  <script src="script.js"></script>
</body>
</html>
