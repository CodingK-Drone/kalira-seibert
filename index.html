<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Writing Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="timeline">
    <header class="topbar"><span class="back" aria-hidden="true">←</span><div><h1 id="top-name">the writer</h1><span id="post-count">Writing archive</span></div></header>
    <div class="banner"></div>
    <section class="profile"><div class="avatar big" aria-hidden="true">✦</div><h2 id="profile-name">the writer</h2><p class="handle" id="profile-handle">@writer</p><p id="profile-bio">a collection of words worth keeping.</p></section>
    <nav class="tabs"><span>Posts</span></nav>
    <div class="search-wrap"><label for="search">Search posts</label><input id="search" type="search" placeholder="Search the archive…"></div>
    <section id="feed" aria-label="Archived posts"></section>
    <p id="empty" hidden>No posts found.</p>
    <footer>Preserved with care.</footer>
  </main>
  <script src="posts.js"></script>
  <script src="script.js"></script>
</body>
</html>
